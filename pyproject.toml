[project]
name = "mcp-server-email"
version = "0.1.0"
description = "MCP server for Vyzno email operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.1,<5",
    "httpx>=0.28.1,<0.29",
    "pydantic[email]>=2,<3",
    "pydantic-settings>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_email"]
